<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheStoreWare | Reset Password</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#20242a}
.card{background:#fff;width:100%;max-width:460px;padding:38px;border-radius:12px;box-shadow:0 5px 24px rgba(0,0,0,.10)}
.brand{text-align:center;font-size:30px;font-weight:700;margin-bottom:6px}
.subtitle{text-align:center;color:#666;margin-bottom:26px}
label{display:block;margin-top:16px;font-weight:600}
input{width:100%;padding:12px;margin-top:7px;border:1px solid #cfd5dc;border-radius:6px;font-size:15px}
button,.button{display:block;width:100%;padding:12px;margin-top:22px;border:0;border-radius:6px;cursor:pointer;font-size:16px;text-align:center;text-decoration:none;background:#20242a;color:#fff}
.note{color:#666;font-size:14px;line-height:1.5}
.errorlist{color:#b42318;padding-left:20px}
.link{text-align:center;margin-top:18px}
.link a{text-decoration:none}
</style>

</head>
<body>
<div class="card">
<div class="brand">TheStoreWare</div>
<div class="subtitle">Reset your password</div>
<p class="note">Enter the email address associated with your account. If an account exists, password reset instructions will be sent to that address.</p>
<form method="post">
{% csrf_token %}
{{ form.email.errors }}
<label for="{{ form.email.id_for_label }}">Email address</label>
{{ form.email }}
<button type="submit">Send Reset Link</button>
</form>
<div class="link"><a href="{% url 'login' %}">Back to Sign In</a></div>
</div>
</body>
</html>
